---
- name: Create RKE2 directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/rancher/rke2
    - /var/lib/rancher/rke2/agent/images
    - /var/lib/rancher/rke2/server/manifests
    - /var/log/kube-audit

- name: Template RKE2 server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: '0644'

- name: Template audit policy
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: /etc/rancher/rke2/audit-policy.yaml
    mode: '0644'

- name: Configure packaged Traefik
  ansible.builtin.template:
    src: rke2-traefik-config.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/rke2-traefik-config.yaml
    mode: '0644'

- name: Check whether RKE2 is installed
  ansible.builtin.stat:
    path: /usr/local/bin/rke2
  register: rke2_binary

- name: Stage RKE2 image archive
  ansible.builtin.copy:
    src: "{{ local_artifacts_dir }}/rke2-images.linux-amd64.tar.zst"
    dest: /var/lib/rancher/rke2/agent/images/rke2-images.linux-amd64.tar.zst
    mode: '0644'
  when: offline_install | bool

- name: Stage bootstrap application images
  ansible.builtin.copy:
    src: "{{ bootstrap_images_archive }}"
    dest: /var/lib/rancher/rke2/agent/images/bootstrap-images.tar
    mode: '0644'
  when:
    - offline_install | bool
    - import_bootstrap_images | bool

- name: Install RKE2 offline from local artifacts
  ansible.builtin.shell: |
    set -euo pipefail
    cd {{ local_artifacts_dir }}
    sha256sum -c sha256sum-amd64.txt --ignore-missing
    INSTALL_RKE2_VERSION={{ rke2_version }} INSTALL_RKE2_TYPE=server INSTALL_RKE2_METHOD=tar INSTALL_RKE2_ARTIFACT_PATH={{ local_artifacts_dir }} {{ local_artifacts_dir }}/rke2-install.sh
  args:
    executable: /bin/bash
  when:
    - offline_install | bool
    - not rke2_binary.stat.exists

- name: Install RKE2 online
  ansible.builtin.shell: |
    curl -sfL https://get.rke2.io | INSTALL_RKE2_VERSION={{ rke2_version }} sh -
  when:
    - not offline_install | bool
    - not rke2_binary.stat.exists

- name: Enable and start RKE2 server
  ansible.builtin.systemd:
    name: rke2-server
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for RKE2 API
  ansible.builtin.uri:
    url: https://127.0.0.1:6443/readyz
    validate_certs: no
    status_code: 200
  register: rke2_ready
  until: rke2_ready.status == 200
  retries: 60
  delay: 10
  run_once: true
  when: inventory_hostname == groups['rke2_servers'][0]

- name: Import bootstrap images immediately after containerd is available
  ansible.builtin.command: /var/lib/rancher/rke2/bin/ctr --address /run/k3s/containerd/containerd.sock --namespace k8s.io images import /var/lib/rancher/rke2/agent/images/bootstrap-images.tar
  register: bootstrap_import
  changed_when: bootstrap_import.rc == 0
  when:
    - offline_install | bool
    - import_bootstrap_images | bool
