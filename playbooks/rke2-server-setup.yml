---
# RKE2 Server Installation Playbook for RHEL 9 Airgap
# This playbook installs and configures RKE2 control plane servers

- name: Prepare RKE2 Servers
  hosts: rke2_servers
  become: true
  gather_facts: true

  tasks:
    - name: Update dnf cache
      dnf:
        update_cache: yes
        cache_valid_time: 3600
      when: not airgap_enabled

    - name: Install required packages (online)
      dnf:
        name:
          - curl
          - wget
          - ca-certificates
          - iptables
          - socat
          - conntrack-tools
          - ipset
          - open-vm-tools
          - python3
          - container-selinux
          - selinux-policy-targeted
          - libseccomp
          - policycoreutils-python-utils
        state: present
      when: not airgap_enabled

    - name: Install required packages from local repo (airgap)
      dnf:
        name:
          - curl
          - wget
          - ca-certificates
          - iptables
          - socat
          - conntrack-tools
          - ipset
          - open-vm-tools
          - python3
          - container-selinux
          - selinux-policy-targeted
          - libseccomp
          - policycoreutils-python-utils
        state: present
        disablerepo: "*"
        enablerepo: "local-repo"
      when: airgap_enabled

    - name: Set system timezone
      timezone:
        name: "{{ system_timezone }}"

    - name: Configure chrony (online)
      dnf:
        name: chrony
        state: present
      when: not airgap_enabled

    - name: Configure chrony from local repo (airgap)
      dnf:
        name: chrony
        state: present
        disablerepo: "*"
        enablerepo: "local-repo"
      when: airgap_enabled

    - name: Configure chrony NTP servers
      lineinfile:
        path: /etc/chrony.conf
        regexp: '^pool '
        line: "pool {{ item }} iburst"
        create: yes
      loop: "{{ ntp_servers }}"
      notify: restart chrony

    - name: Disable swap
      command: swapoff -a
      ignore_errors: yes

    - name: Remove swap from fstab
      lineinfile:
        path: /etc/fstab
        regexp: '.*swap.*'
        state: absent

    - name: Load kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Add kernel modules to modules-load
      copy:
        dest: "/etc/modules-load.d/{{ item }}.conf"
        content: "{{ item }}"
      loop:
        - overlay
        - br_netfilter

    - name: Configure sysctl for Kubernetes
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { name: net.bridge.bridge-nf-call-iptables, value: 1 }
        - { name: net.bridge.bridge-nf-call-ip6tables, value: 1 }
        - { name: net.ipv4.ip_forward, value: 1 }

    - name: Configure SELinux for container runtime
      selinux:
        policy: targeted
        state: permissive
      when: ansible_selinux.status == "enabled"

    - name: Set SELinux context for container runtime directories
      sefcontext:
        target: "{{ item }}"
        setype: container_file_t
        state: present
      loop:
        - "/var/lib/rancher/rke2(/.*)?"
        - "/etc/rancher/rke2(/.*)?"
        - "/var/lib/kubelet(/.*)?"
      when: ansible_selinux.status == "enabled"

    - name: Apply SELinux context changes
      command: restorecon -Rv /var/lib/rancher/rke2 /etc/rancher/rke2 /var/lib/kubelet
      when: ansible_selinux.status == "enabled"
      ignore_errors: yes

    - name: Create RKE2 config directory
      file:
        path: "{{ rke2_config_dir }}"
        state: directory
        mode: '0755'

    - name: Configure RKE2 server config
      copy:
        dest: "{{ rke2_config_dir }}/config.yaml"
        content: |
          {% for key, value in rke2_server_config.items() %}
          {{ key }}: {{ value }}
          {% endfor %}
        mode: '0644'

    - name: Download RKE2 install script (online)
      get_url:
        url: https://get.rke2.io
        dest: /tmp/rke2-install.sh
        mode: '0755'
      register: rke2_script
      until: rke2_script is succeeded
      retries: 3
      delay: 5
      when: not airgap_enabled

    - name: Copy RKE2 install script from local binaries (airgap)
      copy:
        src: "{{ airgap_rke2_binary_path }}/rke2-install.sh"
        dest: /tmp/rke2-install.sh
        mode: '0755'
      when: airgap_enabled

    - name: Install RKE2 server (online)
      shell: |
        INSTALL_RKE2_VERSION="{{ rke2_version }}" INSTALL_RKE2_CHANNEL=stable sh /tmp/rke2-install.sh
      args:
        creates: "{{ rke2_install_dir }}/rke2"
      environment:
        INSTALL_RKE2_VERSION: "{{ rke2_version }}"
        INSTALL_RKE2_CHANNEL: stable
      when: not airgap_enabled

    - name: Install RKE2 server from local binaries (airgap)
      shell: |
        INSTALL_RKE2_VERSION="{{ rke2_version }}" INSTALL_RKE2_CHANNEL=stable INSTALL_RKE2_ARTIFACT_PATH="{{ airgap_rke2_binary_path }}" sh /tmp/rke2-install.sh
      args:
        creates: "{{ rke2_install_dir }}/rke2"
      environment:
        INSTALL_RKE2_VERSION: "{{ rke2_version }}"
        INSTALL_RKE2_CHANNEL: stable
        INSTALL_RKE2_ARTIFACT_PATH: "{{ airgap_rke2_binary_path }}"
      when: airgap_enabled

    - name: Copy RKE2 airgap images to all nodes
      synchronize:
        src: "{{ airgap_container_images_path }}/"
        dest: "{{ rke2_data_dir }}/agent/images/"
        delete: yes
      when: airgap_enabled
      delegate_to: "{{ item }}"
      loop: "{{ groups['rke2_servers'] }}"

    - name: Enable and start RKE2 server
      systemd:
        name: rke2-server
        state: started
        enabled: yes

    - name: Wait for RKE2 server to be ready (first server only)
      wait_for:
        path: "{{ rke2_config_dir }}/rke2.yaml"
        timeout: 300
      when: rke2_init_server

    - name: Get RKE2 server token from first server
      slurp:
        src: "{{ rke2_config_dir }}/rke2-token"
      register: rke2_token
      when: rke2_init_server
      delegate_to: server-1
      run_once: true

    - name: Set fact for RKE2 token
      set_fact:
        rke2_cluster_token: "{{ rke2_token.content | b64decode }}"
      when: rke2_init_server
      run_once: true

    - name: Copy RKE2 token to other servers
      copy:
        content: "{{ rke2_cluster_token }}"
        dest: "{{ rke2_config_dir }}/rke2-token"
        mode: '0600'
      when: not rke2_init_server

    - name: Add server to cluster (non-init servers)
      lineinfile:
        path: "{{ rke2_config_dir }}/config.yaml"
        line: "server: https://{{ hostvars['server-1']['ansible_host'] }}:{{ api_server_port }}"
      when: not rke2_init_server

    - name: Restart RKE2 server on non-init servers
      systemd:
        name: rke2-server
        state: restarted
      when: not rke2_init_server

    - name: Wait for RKE2 to be ready
      shell: "{{ rke2_install_dir }}/rke2 kubectl get nodes"
      register: rke2_ready
      until: rke2_ready.rc == 0
      retries: 30
      delay: 10
      environment:
        KUBECONFIG: "{{ rke2_config_dir }}/rke2.yaml"

    - name: Add kubectl to system path
      file:
        src: "{{ rke2_install_dir }}/rke2"
        dest: /usr/local/bin/kubectl
        state: link

    - name: Wait for nodes to be ready
      shell: "{{ rke2_install_dir }}/rke2 kubectl wait --for=condition=ready node --all --timeout=600s"
      environment:
        KUBECONFIG: "{{ rke2_config_dir }}/rke2.yaml"
      when: rke2_init_server
      run_once: true

  handlers:
    - name: restart chrony
      systemd:
        name: chronyd
        state: restarted
