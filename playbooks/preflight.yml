---
- name: Air-gap node preflight
  hosts: rke2_cluster
  become: yes
  gather_facts: yes
  tasks:
    - name: Require RHEL 9
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "RedHat"
          - ansible_facts.distribution_major_version == "9"
        fail_msg: "This package targets RHEL 9."
    - name: Require amd64
      ansible.builtin.assert:
        that: ansible_facts.architecture in ["x86_64", "amd64"]
        fail_msg: "This bundle contains linux-amd64 RKE2 artifacts."
    - name: Require default route
      ansible.builtin.command: ip route show default
      changed_when: false
    - name: Require no active swap
      ansible.builtin.command: swapon --show --noheadings
      register: swap_state
      changed_when: false
      failed_when: swap_state.stdout | trim != ""
    - name: Require Longhorn host utilities
      ansible.builtin.command: "bash -lc 'command -v {{ item }}'"
      changed_when: false
      loop: [bash, curl, findmnt, grep, awk, blkid, lsblk, iscsiadm]
    - name: Require iSCSI daemon
      ansible.builtin.command: systemctl is-active iscsid
      changed_when: false
    - name: Require RKE2 SELinux RPM installed
      ansible.builtin.command: rpm -q rke2-selinux
      changed_when: false
